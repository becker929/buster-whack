name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run canon:check
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:smoke
      - run: npm run build
      - run: npm run size

      - name: Visual goldens
        run: npm run visual

      # Pack zero is the procedural art baked to cells. Every cell must equal
      # its painter byte for byte, and the flagged scenes must render the
      # same through the pack and through the painters.
      - name: Art identity
        run: npm run art:check

      # The harness deletes the runner's font set and registers the two
      # JetBrains Mono faces committed under tools/visual/fonts/, so the text
      # in a golden does not depend on what this image happens to ship. This
      # asserts that on the runner itself. It runs after the golden comparison
      # so that a plain visual regression reports through the richer check and
      # still produces diff images to upload.
      - name: Prove the goldens do not depend on the runner's fonts
        run: npm run visual:proof

      # Numbers in a log do not tell you what moved. On a failure, upload the
      # golden / actual / diff triple for every changed frame so a reviewer can
      # look at the change and decide whether to accept it.
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-${{ github.run_id }}
          path: .visual/diff/
          if-no-files-found: ignore
          retention-days: 14

  # The touch and keyboard suite drives the real shell in Chromium: pointer
  # capture, the fire latch, the stick, the context bar, gesture containment.
  # Playwright is not a devDependency (it is large and only this job needs
  # it), so it is installed here without touching the lockfile.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright@1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
